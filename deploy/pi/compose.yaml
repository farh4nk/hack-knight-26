# Runs on the Raspberry Pi: daemon (camera, Presage, telemetry, audio) + analytics (Tiger Data, Gemini) + web UI + Caddy (HTTPS, local CA).
# Images are built on a laptop and shipped by build_and_ship.sh; the Pi builds nothing.
#
#   cd ~/cradleecho && docker compose up -d
#   Open https://<pi-host>.local/ from any device on the same network (after pairing at http://<pi-host>.local/pair).
#   Plain HTTP on :3000, :8000, :8001 still works for debugging and existing docs.
name: cradleecho

services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./pair:/srv/pair:ro
    environment:
      - SITE_HOST=${SITE_HOST:-raspberrypi.local}
      - SITE_EXTRA=${SITE_EXTRA:-}
    depends_on:
      - web
      - daemon
      - analytics
    restart: unless-stopped

  daemon:
    image: cradleecho-daemon:latest
    ports:
      - "8000:8000"
    env_file:
      - daemon.env # PRESAGE_API_KEY etc.
    environment:
      - CRADLEECHO_LISTEN=${CRADLEECHO_LISTEN:-0}
      - CRADLEECHO_MIC=${CRADLEECHO_MIC:-default}
      # Pi 4 tuning, measured on a Pi 4 + Logitech Brio 101:
      # - The Presage bridge only keeps up with ~14 fps at 640x480 but ~27 fps at 480x360. It
      #   needs >= 25 fps (kFrameRateTooLow otherwise).
      # - The face gate wants 1.75 face-heights of empty space below the chin by default, which
      #   forces a very specific seating position; 1.0 still leaves Presage room to judge the chest.
      # - Presage's own frame throttle equals the camera rate, so jitter drops frames; 60 disables it.
      - CRADLEECHO_PRESAGE_CMD=/opt/bridge/bridge --stdin ${PRESAGE_FRAME_SIZE:-480x360}
      - CRADLEECHO_GATE_CHEST_ROOM=${GATE_CHEST_ROOM:-1.0}
      - CRADLEECHO_PRESAGE_FPS=${PRESAGE_FPS:-60}
      # presage = this Pi runs Presage itself; mock = camera-only unit (Presage runs elsewhere).
      - CRADLEECHO_SOURCE=${CRADLEECHO_SOURCE:-presage}
      - CRADLEECHO_STREAM_FPS=${CRADLEECHO_STREAM_FPS:-20}
      - CRADLEECHO_DIAG=${CRADLEECHO_DIAG:-0} # 1 = log pipeline rates every 5 s (DIAG lines)
    devices:
      # Container path stays /dev/video0 (the image's CRADLEECHO_CAMERA). Run pi_check.sh to
      # find which host node is the Logitech; a Pi has many /dev/video* nodes.
      - "${CRADLEECHO_VIDEO_DEVICE:-/dev/video0}:/dev/video0"
      - /dev/dri:/dev/dri
      - /dev/snd:/dev/snd
    group_add:
      # Numeric host GIDs: names resolve inside the image, not on the host.
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-105}"
      - "${AUDIO_GID:-29}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 15s
      timeout: 5s
      retries: 3

  analytics:
    image: cradleecho-analytics:latest
    ports:
      - "8001:8001"
    env_file:
      - analytics.env # TIGER_DATA_CONNECTION_STRING, GEMINI_API_KEY
    depends_on:
      - daemon
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    image: cradleecho-web:latest
    ports:
      - "3000:3000"
    env_file:
      - web.env # ELEVENLABS_API_KEY (used by the server-side voice routes)
    depends_on:
      - daemon
      - analytics
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
